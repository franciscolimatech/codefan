name: API CI

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Ruff (lint and format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Check lint
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

  tests:
    name: Django checks and Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codefan
          POSTGRES_PASSWORD: codefan_ci
          POSTGRES_DB: codefan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codefan -d codefan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SECRET_KEY: django-insecure-ci-only-not-a-production-secret
      DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_USER: codefan
      POSTGRES_PASSWORD: codefan_ci
      POSTGRES_DB: codefan_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: python -m pip install poetry==2.5.1

      - name: Install dependencies
        run: poetry install --no-root --no-interaction --no-ansi

      - name: Django system checks
        run: poetry run python manage.py check

      - name: Run tests
        run: poetry run pytest -q

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --tag codefan-api:ci ./api
