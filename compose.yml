services:
  database:
    image: postgres:16-alpine
    container_name: codefan_database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - codefan_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: codefan_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  codefan_postgres_data:
